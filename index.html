<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sign in Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <br>
    <div class="flex-container">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google Logo"
            width="92" height="30">
    </div>
    </br>

    <h1>Sign in</h1>
    <h4> with your Google Account</h4>
    <form action="/login" method="post">
        <div>

            <input type="text" class="my-textbox" value="Email or Phone:">
        
        </div>
        <div>
            <br>
            <a href="https://example.com">Forgot email?</a>
        </div>
        <div>
            <p>Not your computer? Use Guest mode to sign in privately. 
                <br>
                <br>
                <a href="https://example.com">Learn more</a></p>
            </br>
        </div>
        <div> 
            
            <a href="https://example.com">Create account</a>
            <button class="my-button">Next</button>
        </div>
        </div>
    </form>
</body>

</html>
